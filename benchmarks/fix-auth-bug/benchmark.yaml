schemaVersion: 1
name: fix-auth-bug
task: |
  Fix refresh-token expiry handling in auth.mjs. A token is valid strictly before
  its expiresAt timestamp (Unix seconds); nowMs is in milliseconds. Reject revoked
  tokens, missing tokens, and non-finite timestamps. Do not change the tests.
validation:
  - command: node
    args: [--test, "{validation}/check.test.mjs"]
timeout: 120
validationTimeout: 15
