name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Do not prepare/publish from a stale successful run after main has moved.
      - name: Check the tested commit is still main
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current_sha=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)
          if [ "$current_sha" = "$TESTED_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Require release credentials
        if: steps.head.outputs.current == 'true'
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo '::error::Add RELEASE_PLEASE_TOKEN as an Actions repository secret with Contents, Pull requests, and Issues read/write permissions for this repository.'
            exit 1
          fi
      # No checkout or execution of repository code in the credential-bearing job.
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        if: steps.head.outputs.current == 'true'
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
