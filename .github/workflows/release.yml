name: Draft GitHub release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: node scripts/check-version.mjs
        env:
          RELEASE_TAG: ${{ github.ref_name }}

  draft:
    needs: [checks, version]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      # No checkout, dependency installation, or repository scripts in the write-token job.
      - name: Create draft prerelease for maintainer review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo 'Release already exists; leaving it unchanged.'
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease \
              --title "$RELEASE_TAG" --generate-notes
          fi
