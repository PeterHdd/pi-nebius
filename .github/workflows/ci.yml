name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '23 7 * * 1'

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22.19.0'
          - os: ubuntu-latest
            node: '24'
          - os: macos-latest
            node: '22'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci
      - run: npm run version:check
      - run: npm run check
      - run: npm run package:check
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22.19.0'

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run security:check

  required:
    name: Required checks
    if: always()
    needs: [test, security]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every test and security job
        env:
          TEST_RESULT: ${{ needs.test.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: test "$TEST_RESULT" = success && test "$SECURITY_RESULT" = success
